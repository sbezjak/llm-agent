[project]
name = "llm_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.1.0",
    "ollama>=0.6.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-html>=4",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
markers = [
    "mocked: fast unit tests, LLM backend HTTP mocked with respx",
    "live: slow, requires the live LLM backend at localhost:11434",
    "external: opt-in DeepEval cross-check, triangulates our detectors against a production tool",
]

[tool.ruff]
line-length = 100
target-version = "py311"
